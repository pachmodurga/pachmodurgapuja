<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्वागतम - पूजा एवं फंड पोर्टल</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4a040e, #7c1223, #ff8c00);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-weight: bold;
            color: #ffc107;
            margin-bottom: 25px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            font-size: 2rem;
        }
        .form-label {
            font-weight: bold;
            color: #ffeb3b;
            text-align: left;
        }
        .btn-preview {
            background: #28a745;
            color: #fff;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-size: 1.2rem;
            margin-top: 15px;
            border: none;
        }
        .btn-login {
            background: #ffc107;
            color: #000;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-size: 1.2rem;
            margin-top: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>पचमो पूजा एवं उत्सव पोर्टल</h1>
        
        <form id="portalForm">
            <div class="mb-3 text-start">
                <label class="form-label">पूजा का चयन करें (Select Puja):</label>
                <select id="pujaSelect" class="form-select form-select-lg fw-bold">
                    <option value="दुर्गा पूजा">दुर्गा पूजा (Durga Puja)</option>
                    <option value="सरस्वती पूजा">सरस्वती पूजा (Saraswati Puja)</option>
                    <option value="लक्ष्मी पूजा">लक्ष्मी पूजा (Laxmi Puja)</option>
                    <option value="छठ पूजा">छठ पूजा (Chhath Puja)</option>
                    <option value="जन्माष्टमी">जन्माष्टमी (Janmashtami)</option>
                </select>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">वर्ष का चयन करें (Select Year):</label>
                <select id="yearSelect" class="form-select form-select-lg fw-bold">
                    <option value="2026" selected>2026</option>
                    <option value="2025">2025</option>
                    <option value="2027">2027</option>
                </select>
            </div>

            <button type="button" onclick="goToDashboard()" class="btn btn-preview">👀 पब्लिक प्रीव्यू (Public Preview)</button>
            <a href="/login" class="btn btn-login" onclick="setLoginSession(event)">Committee Only Login</a>
        </form>
    </div>

    <script>
        function goToDashboard() {
            const puja = document.getElementById('pujaSelect').value;
            const year = document.getElementById('yearSelect').value;
            window.location.href = `/dashboard?puja=${encodeURIComponent(puja)}&year=${year}`;
        }

        function setLoginSession(event) {
            // लॉगिन पेज पर पूजा और साल की जानकारी फॉरवर्ड करने के लिए
            const puja = document.getElementById('pujaSelect').value;
            const year = document.getElementById('yearSelect').value;
            event.target.href = `/login?puja=${encodeURIComponent(puja)}&year=${year}`;
        }
    </script>
</body>
</html>
