<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्वागतम - पचमो दुर्गा पूजा पोर्टल</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4a040e, #7c1223, #ff8c00);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-weight: bold;
            color: #ffc107;
            margin-bottom: 40px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .btn-preview {
            background: #28a745;
            color: #fff;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.3rem;
            margin-bottom: 20px;
            transition: all 0.3s;
            border: none;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        .btn-preview:hover {
            background: #218838;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.6);
        }
        .btn-login {
            background: #ffc107;
            color: #000;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.3rem;
            transition: all 0.3s;
            border: none;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }
        .btn-login:hover {
            background: #e0a800;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.6);
        }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>पचमो दुर्गा पूजा पोर्टल</h1>
        <a href="/dashboard" class="btn btn-preview">👀 पब्लिक प्रीव्यू (Public Preview)</a>
        <a href="/login" class="btn btn-login">Committe Only Login</a>
    </div>
</body>
</html>
