<!-- report_print.html -->
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-size: 1.2rem;
            color: #333;
            padding: 40px;
        }
        h1 {
            color: #4a040e;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .table {
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        .table thead {
            background-color: #4a040e !important;
            color: #fff;
        }
        .table th, .table td {
            vertical-align: middle;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1 class="text-center mb-4">{{ title }}</h1>
    <table class="table table-bordered align-middle fs-4">
        <thead class="table-dark">
            <tr>
                <th style="width: 10%;">#</th>
                <th style="width: 45%;">नाम / विवरण</th>
                <th style="width: 25%;">तारीख</th>
                <th style="width: 20%;">राशि</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td class="fw-bold">{{ loop.index }}</td>
                <td>{{ item.name if type == 'contrib' else item.title }}</td>
                <td class="text-muted">{{ item.date }}</td>
                <td class="fw-bold text-danger">₹ {{ item.amount }}</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot class="table-group-divider fs-3">
            <tr>
                <th colspan="3" class="text-end">कुल योग:</th>
                <th class="text-success">₹ {{ total }}</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
